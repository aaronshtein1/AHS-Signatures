version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ahs_signatures
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3041:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ahs_signatures
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL:-}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-}
      - CORS_ORIGIN=http://localhost:3040
      - FRONTEND_URL=http://localhost:3040
      - TOKEN_EXPIRY_HOURS=72
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=aronshteina@gmail.com
      - SMTP_PASS=oumbdtyajzjolkkq
      - SMTP_SECURE=false
      - EMAIL_FROM=aronshteina@gmail.com
      - EMAIL_FROM_NAME=AHS Signatures
      - ADMIN_EMAIL=aronshteina@gmail.com
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3041
    ports:
      - "3040:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3041
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
